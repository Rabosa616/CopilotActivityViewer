name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build CopilotActivityViewer.slnx -c Release

      - name: Test
        run: dotnet test CopilotActivityViewer.slnx -c Release --no-build

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: CopilotActivityViewer-vsix
          path: src/CopilotActivityViewer/bin/Release/net10.0-windows8.0/CopilotActivityViewer.vsix
          if-no-files-found: error
